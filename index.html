<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bablu Kumar | V6.0 Portfolio</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <a href="#home" class="logo">
            <span>B</span>ablu<span>.</span>
        </a>

        <nav class="navbar">

            <a href="#home" class="active">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#education">Education</a>
            <a href="#contact">Contact</a>

        </nav>

        <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>

    </header>


    <!-- ================= HOME ================= -->

    <section class="home" id="home">

        <div class="home-content">

            <p class="welcome">
                <i class="fa-solid fa-hand-sparkles"></i>
                Welcome to my portfolio
            </p>

            <h1>
                Hi, I'm <span>Bablu Kumar</span>
            </h1>

            <h2>
                I'm a <span class="typing-text">Web Designer</span>
            </h2>

            <p class="home-description">
                I create modern, responsive and user-friendly websites
                with clean design and creative ideas.
            </p>

            <div class="home-buttons">

                <a href="#projects" class="btn primary-btn">
                    View My Work
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <a href="#contact" class="btn secondary-btn">
                    Contact Me
                    <i class="fa-regular fa-paper-plane"></i>
                </a>

            </div>


            <!-- Social Icons -->

            <div class="social-icons">

                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#" aria-label="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

                <a href="#" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

            </div>

        </div>


        <!-- Profile Image -->

        <div class="home-image">

            <div class="image-circle">

                <img src="profile.jpg"
                    alt="Bablu Kumar">

            </div>

        </div>

    </section>


    <!-- ================= SCROLL INDICATOR ================= -->

    <div class="scroll-down">

        <a href="#about">

            <span>Scroll Down</span>

            <i class="fa-solid fa-arrow-down"></i>

        </a>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
