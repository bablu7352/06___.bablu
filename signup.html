<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ConnectU</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Connect<span>U</span>
            </div>

            <h1>
                Create your account
            </h1>

            <p>
                Join ConnectU and connect with friends.
            </p>


            <form id="signupForm">


                <div class="input-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Confirm password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>


                <p
                    id="signupMessage"
                    class="auth-message"
                ></p>

            </form>


            <div class="auth-divider">
                <span>Already have an account?</span>
            </div>


            <a
                href="login.html"
                class="secondary-button"
            >
                Login
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to ConnectU
            </a>

        </div>

    </div>


    <script
        type="module"
        src="js/auth.js"
    ></script>

</body>

</html>
