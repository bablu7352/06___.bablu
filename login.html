<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ConnectU</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Connect<span>U</span>
            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Login to continue to ConnectU.
            </p>


            <form id="loginForm">


                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>

            </form>


            <div class="auth-divider">
                <span>New to ConnectU?</span>
            </div>


            <a
                href="signup.html"
                class="secondary-button"
            >
                Create New Account
            </a>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to ConnectU
            </a>

        </div>

    </div>


    <script
        type="module"
        src="js/auth.js"
    ></script>

</body>

</html>
