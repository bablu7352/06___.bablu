<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SocialHub - Login</title>

    <!-- Login CSS -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <main class="auth-container">

        <!-- LEFT SIDE -->
        <section class="auth-left">

            <div class="auth-logo">
                SocialHub
            </div>

            <h1>
                Connect with people.
            </h1>

            <p>
                Share moments, chat with friends,
                and stay connected.
            </p>

        </section>


        <!-- LOGIN CARD -->
        <section class="auth-card">

            <h2>Login</h2>

            <p class="auth-subtitle">
                Welcome back to SocialHub
            </p>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="auth-btn">
                    Login
                </button>

            </form>


            <!-- LOGIN MESSAGE -->
            <div id="loginMessage"></div>


            <!-- DIVIDER -->
            <div class="auth-divider">
                <span>OR</span>
            </div>


            <!-- SIGNUP -->
            <a
                href="signup.html"
                class="create-account">
                Create New Account
            </a>

        </section>

    </main>


    <!-- IMPORTANT:
         auth.js is in the ROOT folder -->
    <script
        type="module"
        src="auth.js">
    </script>

</body>
</html>
